[package]
name = "ollama-qwen-ui"
version = "1.0.0"
description = "Native UI for the local Ollama Qwen2.5 server"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt", "sync"] }
reqwest = { version = "0.12", features = ["json"] }
once_cell = "1"

[profile.release]
strip = true
opt-level = "z"
lto = true
